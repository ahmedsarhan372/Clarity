      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#713f2b" flood-opacity=".16"/>
    </filter>
  </defs>
